[tool.poetry]
name = "resume"
version = "0.1.0"
description = "Specification-driven LaTeX résumé and CV publishing system"
authors = ["Alan Szmyt <szmyty@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
