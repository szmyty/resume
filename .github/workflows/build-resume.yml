name: Validate and Build Career Documents

on:
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "resume.sty"
      - "cv.sty"
      - "sections/**"
      - "profiles/**"
      - "documents/**"
      - "targets/**"
      - "templates/**"
      - "scripts/**"
      - "tests/**"
      - "specs/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".latexmkrc"
      - ".github/workflows/build-resume.yml"
  pull_request:
    branches:
      - main
    paths:
      - "content/**"
      - "resume.sty"
      - "cv.sty"
      - "sections/**"
      - "profiles/**"
      - "documents/**"
      - "targets/**"
      - "templates/**"
      - "scripts/**"
      - "tests/**"
      - "specs/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".latexmkrc"
      - ".github/workflows/build-resume.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate facts, privacy, and configuration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install "pypdf>=5,<6" "pyyaml>=6,<7" "pytest>=8,<9"

      - name: Validate canonical facts
        run: python scripts/quality_gates.py validate-facts

      - name: Validate document manifests
        run: python scripts/quality_gates.py validate-documents

      - name: Validate role profiles and evidence
        run: python scripts/quality_gates.py validate-profiles

      - name: Check unresolved placeholders
        run: python scripts/quality_gates.py check-placeholders

      - name: Validate public destinations
        run: python scripts/quality_gates.py validate-destinations --audience public --online

      - name: Validate application destinations
        run: python scripts/quality_gates.py validate-destinations --audience application --online

      - name: Run unit tests
        run: python -m pytest tests/ -v

  build:
    name: Build and inspect publication artifacts
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install "pypdf>=5,<6" "pyyaml>=6,<7"

      - name: Install TeX and PDF inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            poppler-utils \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-latex-extra

      - name: Build and validate public résumé artifacts
        run: |
          set -euo pipefail
          mkdir -p rendered/public

          profiles=(general platform research mobile-geospatial)
          for profile in "${profiles[@]}"; do
            python scripts/build.py \
              --document resume \
              --profile "${profile}" \
              --audience public

            case "${profile}" in
              general)
                pdf="dist/resume/general/public/Alan-Szmyt-Resume.pdf"
                ;;
              platform)
                pdf="dist/resume/platform/public/Alan-Szmyt-Resume-Platform-DevEx-Public.pdf"
                ;;
              research)
                pdf="dist/resume/research/public/Alan-Szmyt-Resume-Research-AI-Systems-Public.pdf"
                ;;
              mobile-geospatial)
                pdf="dist/resume/mobile-geospatial/public/Alan-Szmyt-Resume-Mobile-Geospatial-Public.pdf"
                ;;
            esac

            python scripts/quality_gates.py validate-ats \
              --pdf "${pdf}" \
              --audience public \
              --summary-file "${GITHUB_STEP_SUMMARY}"
            python scripts/quality_gates.py validate-pdf \
              --pdf "${pdf}" \
              --audience public \
              --summary-file "${GITHUB_STEP_SUMMARY}"

            mkdir -p "rendered/public/${profile}"
            pdftoppm \
              -png \
              -r 144 \
              "${pdf}" \
              "rendered/public/${profile}/page"
          done

      - name: Build and validate application role variants
        env:
          CONTACT_FILE: ${{ runner.temp }}/application-contact.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path(os.environ["CONTACT_FILE"]).write_text(
              json.dumps(
                  {
                      "email": "applicant@example.invalid",
                      "phone": "+1 555-010-0200",
                      "location": "Application City, MA",
                  }
              ),
              encoding="utf-8",
          )
          PY

          profiles=(platform research mobile-geospatial)
          for profile in "${profiles[@]}"; do
            python scripts/build.py \
              --document resume \
              --profile "${profile}" \
              --audience application \
              --contact-file "${CONTACT_FILE}"

            case "${profile}" in
              platform)
                pdf="dist/resume/platform/application/Alan-Szmyt-Resume-Platform-DevEx.pdf"
                ;;
              research)
                pdf="dist/resume/research/application/Alan-Szmyt-Resume-Research-AI-Systems.pdf"
                ;;
              mobile-geospatial)
                pdf="dist/resume/mobile-geospatial/application/Alan-Szmyt-Resume-Mobile-Geospatial.pdf"
                ;;
            esac

            python scripts/quality_gates.py validate-ats \
              --pdf "${pdf}" \
              --audience application \
              --summary-file "${GITHUB_STEP_SUMMARY}"
            python scripts/quality_gates.py validate-pdf \
              --pdf "${pdf}" \
              --audience application \
              --contact-file "${CONTACT_FILE}" \
              --summary-file "${GITHUB_STEP_SUMMARY}"
          done

      - name: Smoke-test public research CV
        run: |
          set -euo pipefail
          pdf="dist/cv/research/public/Alan-Szmyt-CV-Research-AI-Systems-Public.pdf"
          python scripts/build.py \
            --document cv \
            --profile research \
            --audience public
          python scripts/quality_gates.py validate-ats \
            --pdf "${pdf}" \
            --audience public \
            --summary-file "${GITHUB_STEP_SUMMARY}"

      - name: Summarize public artifacts
        run: |
          set -euo pipefail
          {
            echo "## Public Artifact Inventory"
            echo ""
            echo "| Artifact | Pages | SHA-256 |"
            echo "| --- | ---: | --- |"
            find dist -path "*/public/*.pdf" -type f -print0 \
              | sort -z \
              | while IFS= read -r -d '' artifact; do
                  pages="$(pdfinfo "${artifact}" | awk '/^Pages:/ {print $2}')"
                  sha="$(sha256sum "${artifact}" | awk '{print $1}')"
                  echo "| $(basename "${artifact}") | ${pages} | \`${sha}\` |"
                done
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload public PDFs and visual renders
        uses: actions/upload-artifact@v4
        with:
          name: public-career-documents
          path: |
            dist/resume/*/public/*.pdf
            dist/cv/*/public/*.pdf
            rendered/public/**/*.png
          if-no-files-found: error
          retention-days: 30
